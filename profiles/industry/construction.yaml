# Industry profile: Construction (Строительство / Будівництво)
name: Construction
name_ru: Строительство
name_uk: Будівництво

workflow: profiles/workflow/default.yaml
tax: profiles/tax/us_2024.yaml

warehouse:
  lot_tracking: true
  fifo: false
  expiry_control: false
  multi_location: true    # multiple job sites

maintenance:
  preventive_schedule: calendar_based
  spare_parts_integration: false
  work_order_required: true

payroll:
  overtime_multiplier: 1.5
  shift_allowance: false
  hazard_pay: true

procurement:
  three_way_match: true
  qty_tolerance_pct: 5
  price_tolerance_pct: 3
  hard_block: false     # soft warning only — site conditions vary

budget:
  hard_stop: false
  warn_threshold: 0.8
  period: monthly
