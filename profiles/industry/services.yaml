name_ru: Услуги
name_uk: Послуги

workflow: profiles/workflow/default.yaml
tax: profiles/tax/eu_2024.yaml

warehouse:
  lot_tracking: false
  fifo: false
  expiry_control: false
  multi_location: false

maintenance:
  preventive_schedule: calendar_based
  spare_parts_integration: false
  work_order_required: false

