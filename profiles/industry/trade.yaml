# Industry profile: Trade / Retail (Торговля / Торгівля)
name: Trade
name_ru: Торговля
name_uk: Торгівля

workflow: profiles/workflow/default.yaml
tax: profiles/tax/ua_2024.yaml

warehouse:
  lot_tracking: false
  fifo: true
  expiry_control: true
  multi_location: true

maintenance:
  preventive_schedule: calendar_based
  spare_parts_integration: false
  work_order_required: false

payroll:
  overtime_multiplier: 1.5
  shift_allowance: false
  hazard_pay: false

procurement:
  three_way_match: true
  qty_tolerance_pct: 2
  price_tolerance_pct: 1
  hard_block: true

budget:
  hard_stop: false
  warn_threshold: 0.9
  period: monthly
