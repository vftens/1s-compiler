###############################################################################
# 1S: ERP — Production Docker Compose with Nginx + SSL
# Start: docker compose -f nginx/docker-compose-prod.yml up -d
###############################################################################
version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: 1s-erp-app
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - ../data/config:/app/config
    environment:
      - PYTHONUTF8=1
      - FLASK_ENV=production
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - web

  nginx:
    image: nginx:1.25-alpine
    container_name: 1s-erp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/1s-erp.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - web

  # Certbot for auto-renewing SSL
  certbot:
    image: certbot/certbot
    container_name: 1s-erp-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  certbot-www:

networks:
  web:
    driver: bridge
