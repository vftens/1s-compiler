# ══════════════════════════════════════════════════════════════════════
# 1S: ERP Free Edition — Nginx reverse proxy config
# Domain: www.1s-compiler.ru  (change to your domain)
#
# Setup:
#   1. Install Nginx: apt install nginx certbot python3-certbot-nginx
#   2. Copy this file: cp nginx.conf /etc/nginx/sites-available/1s-erp
#   3. Enable:        ln -s /etc/nginx/sites-available/1s-erp /etc/nginx/sites-enabled/
#   4. SSL:           certbot --nginx -d www.1s-compiler.ru -d 1s-compiler.ru
#   5. Reload:        nginx -t && systemctl reload nginx
# ══════════════════════════════════════════════════════════════════════

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name 1s-compiler.ru www.1s-compiler.ru;
    return 301 https://$host$request_uri;
}

# ── HTTPS main server ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 1s-compiler.ru www.1s-compiler.ru;

    # SSL — managed by Certbot (filled automatically)
    ssl_certificate     /etc/letsencrypt/live/www.1s-compiler.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.1s-compiler.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff;
    add_header X-Frame-Options           SAMEORIGIN;
    add_header X-XSS-Protection          "1; mode=block";

    # Logging
    access_log /var/log/nginx/1s-erp.access.log;
    error_log  /var/log/nginx/1s-erp.error.log;

    # Proxy to Flask
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) — don't buffer streaming responses
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # Static files served by Nginx directly (faster)
    location /static/ {
        alias      /app/src/static/;
        expires    30d;
        add_header Cache-Control "public, immutable";
    }

    # Favicon
    location = /favicon.ico {
        alias /app/gui/assets/icon.png;
        expires 7d;
    }

    # Health check (no auth required)
    location = /api/v1/ping {
        proxy_pass http://127.0.0.1:5000/api/v1/ping;
    }

    # Block access to config files
    location ~ /config/ {
        deny all;
        return 403;
    }
}
