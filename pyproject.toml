[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "1s-erp"
version = "0.3.0"
description = "1S: ERP Free Edition — open-source 1C-compatible ERP scripting engine"
readme = "README.md"
license = {text = "GNU GPL v3"}
authors = [{name = "vftens", email = "aico@ya.ru"}]
keywords = ["erp", "1c", "accounting", "ukraine", "russia", "bsl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
requires-python = ">=3.10"
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
desktop = ["pywebview", "pystray", "pillow"]
cython  = ["cython>=3.0"]
dev     = ["pytest>=7", "pyinstaller>=6"]

[project.urls]
Homepage   = "https://github.com/vftens/1s-compiler"
Repository = "https://github.com/vftens/1s-compiler"
Issues     = "https://github.com/vftens/1s-compiler/issues"

[project.scripts]
1s = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
