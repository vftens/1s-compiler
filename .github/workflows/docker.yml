# Build the 1S image with GridCraft and publish it to GitHub Container Registry.
# The 1 GB VPS pulls it (nginx/deploy.sh) instead of compiling Rust itself.
name: docker

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/1s-erp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (GridCraft inside the image)
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/1s-erp:sha-${GITHUB_SHA::7}
          docker run --rm "$IMG" /app/bin/gridcraft-cli version
          docker run --rm -e PYTHONPATH=/app "$IMG" python -c "from src.migrate.gridcraft import find_cli; assert find_cli()"
