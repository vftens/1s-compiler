name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install flask pytest

      - name: Run test suite
        run: python -m pytest tests/ -q --tb=short
        env:
          PYTHONUTF8: "1"

      - name: Run smoke test (hello.1s)
        run: python -m src.cli run examples/hello.1s
        env:
          PYTHONUTF8: "1"

      - name: Run smoke test (accounting_uk.1s)
        run: python -m src.cli run examples/accounting_uk.1s
        env:
          PYTHONUTF8: "1"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t 1s-erp:ci .

      - name: Test Docker health
        run: |
          docker run -d --name erp_test -p 5000:5000 1s-erp:ci
          sleep 8
          curl -f http://localhost:5000/api/v1/ping
          docker stop erp_test

  release:
    name: Build .exe (Windows)
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: pip install flask pywebview pystray pillow pyinstaller

      - name: Build .exe
        run: python installer/build.py --zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1S-ERP-windows
          path: dist/1S-ERP-v*.zip
